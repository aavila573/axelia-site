<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#f7f3ee;}
  .og{
    width:1200px;height:630px;position:relative;overflow:hidden;
    background:
      radial-gradient(900px 420px at 50% -80px,#f3e4d3 0%,rgba(243,228,211,0) 70%),
      radial-gradient(700px 320px at 95% 110%, #eaf6ee 0%, rgba(234,246,238,0) 60%),
      #f7f3ee;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px;
  }
  .kicker{font-size:22px;letter-spacing:8px;color:#9c5c2a;font-weight:800;text-transform:uppercase;margin-bottom:18px;}
  h1{font-size:72px;line-height:1.08;color:#2b2621;font-weight:800;letter-spacing:-1px;}
  h1 .em{font-size:64px;}
  .sub{font-size:30px;color:#8a8078;margin-top:16px;font-weight:500;}
  .chips{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap;justify-content:center;}
  .chip{background:#fff;border:1px solid #e6ddd2;border-radius:16px;padding:14px 24px;font-size:24px;font-weight:700;color:#2b2621;}
  .price{
    margin-top:34px;background:linear-gradient(135deg,#c1793f,#9c5c2a);color:#fff;
    border-radius:999px;padding:20px 46px;font-size:40px;font-weight:800;
    box-shadow:0 10px 30px rgba(156,92,42,.35);
  }
  .price small{font-size:24px;font-weight:600;opacity:.9;}
  .draw{margin-top:24px;font-size:27px;font-weight:700;color:#9c5c2a;}
  .foot{margin-top:30px;font-size:24px;color:#8a8078;}
  .foot b{color:#c1793f;}
</style>
</head>
<body>
  <div class="og">
    <div class="kicker">Rifa Solidaria</div>
    <h1><span class="em">🎁</span> Set de Cocina Belwer</h1>
    <div class="sub">Sandwichera · Hervidor · Horno eléctrico · Exprimidor de cítricos</div>
    <div class="chips">
      <span class="chip">🥪 Sandwichera</span>
      <span class="chip">🫖 Hervidor</span>
      <span class="chip">🔥 Horno eléctrico</span>
      <span class="chip">🍊 Exprimidor</span>
    </div>
    <div class="price">$10.000 <small>el número · del 1 al 100</small></div>
    <div class="draw">🎰 Sorteo: viernes 2 de octubre · Sinuano Noche</div>
    <div class="foot">💛 Recaudando fondos para una buena causa</div>
  </div>
</body>
</html>
